steps:
  estate-audit:
    image: python:3.12-slim
    environment:
      ESTATE_GOVERNANCE_TOKEN:
        from_secret: estate_governance_token
    commands:
      - apt-get update -qq && apt-get install -qq -y git >/dev/null
      - rev=$(python -c 'import tomllib; print(next(d["rev"] for d in tomllib.load(open("ESTATE.toml", "rb"))["dep"] if d["id"] == "estate-governance"))')
      - git clone -q "https://x-access-token:$${ESTATE_GOVERNANCE_TOKEN}@github.com/larsbx/estate-governance" .estate
      - git -C .estate checkout -q "$rev"
      - python .estate/kernel/audit_estate_layout.py --root .

  test:
    image: julia:1.11
    commands:
      - julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

when:
  event:
    - push
    - pull_request
