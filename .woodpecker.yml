steps:
  estate-audit:
    image: python:3.12-slim
    commands:
      - apt-get update -qq && apt-get install -qq -y curl >/dev/null
      - rev=$(python -c 'import tomllib; print(next(d["rev"] for d in tomllib.load(open("ESTATE.toml", "rb"))["dep"] if d["id"] == "estate-governance"))')
      - pin=$(python -c 'import tomllib; print(next(d["pin"] for d in tomllib.load(open("ESTATE.toml", "rb"))["dep"] if d["id"] == "estate-governance"))')
      - test "$rev" = "f5fe90d588806c09998764c4929e6238f2298e64"
      - curl --fail --location --proto '=https' --tlsv1.2 --output /tmp/estate-audit.py "https://raw.githubusercontent.com/larsbx/finite-math-kernels/a08928d240cf2c7789fdd9bb3b6dc0c068eeef73/policy/estate-audits/$rev.py"
      - printf '%s  %s\\n' "${pin#sha256:}" /tmp/estate-audit.py | sha256sum --check --strict -
      - python /tmp/estate-audit.py --root .

  test:
    image: julia:1.11
    commands:
      - julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

when:
  event:
    - push
    - pull_request
