name: Estate audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch and verify pinned estate audit
        shell: bash
        run: |
          set -euo pipefail
          rev=$(python3 -c 'import tomllib; print(next(d["rev"] for d in tomllib.load(open("ESTATE.toml", "rb"))["dep"] if d["id"] == "estate-governance"))')
          pin=$(python3 -c 'import tomllib; print(next(d["pin"] for d in tomllib.load(open("ESTATE.toml", "rb"))["dep"] if d["id"] == "estate-governance"))')
          test "$rev" = "63b5605c33af726317a193c303708a37f93d7394"
          curl --fail --location --proto '=https' --tlsv1.2             --output /tmp/estate-audit.py             "https://raw.githubusercontent.com/larsbx/finite-math-kernels/68ea134126e0d1863977e9bb1cca47465fd7bdb8/policy/estate-audits/$rev.py"
          printf '%s  %s\n' "${pin#sha256:}" /tmp/estate-audit.py | sha256sum --check --strict -
          python3 /tmp/estate-audit.py --root .
