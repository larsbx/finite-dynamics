name: Publish locked Julia oracle history experiment

on:
  push:
    branches: [migration/julia-oracle-history]
    paths: [.github/workflows/import-julia-oracle-once.yml]

permissions:
  contents: read

concurrency:
  group: import-julia-oracle-once
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'larsbx/finite-dynamics'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Import immutable public history without rewriting commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Codex'
          git config user.email 'codex@openai.com'
          cp programs/julia-oracle/PROGRAM.toml /tmp/julia-PROGRAM.toml
          git rm programs/julia-oracle/PROGRAM.toml
          git commit -m 'Prepare Julia oracle boundary for history import'
          git fetch --no-tags https://github.com/larsbx/julia-oracle-lab.git 8acb50fc2fea52077a2f3afc9c8407dc07cee799
          git merge -s ours --no-commit --allow-unrelated-histories 8acb50fc2fea52077a2f3afc9c8407dc07cee799
          git read-tree --prefix=programs/julia-oracle/ -u 8acb50fc2fea52077a2f3afc9c8407dc07cee799
          git commit -m 'Import complete Julia oracle history at locked source head'
          cp /tmp/julia-PROGRAM.toml programs/julia-oracle/PROGRAM.toml
          git add programs/julia-oracle/PROGRAM.toml
          git commit -m 'Restore retained Julia oracle program boundary'
      - name: Verify history and authority boundaries
        run: python3 policy/tools/verify_julia_import.py
      - name: Original estate and Julia 1.11 gates
        run: |
          git worktree add --detach /tmp/julia-oracle-source 8acb50fc2fea52077a2f3afc9c8407dc07cee799
          python3 policy/tools/run_estate_gate.py /tmp/julia-oracle-source
          cd /tmp/julia-oracle-source
          julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Imported estate gate
        run: python3 policy/tools/run_estate_gate.py programs/julia-oracle
      - name: Imported Julia 1.11 package tests
        working-directory: programs/julia-oracle
        run: julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Consolidated workspace estate gate
        run: python3 policy/tools/run_estate_gate.py .
      - name: Record verified experiment without transferring authority
        run: |
          python3 policy/tools/record_julia_import.py
          git rm .github/workflows/import-julia-oracle-once.yml
          git add policy programs/julia-oracle/PROGRAM.toml docs README.md ARCHITECTURE.md
          git commit -m 'Record verified Julia oracle import with source authority retained'
          python3 policy/tools/verify_julia_import.py
          python3 policy/tools/run_estate_gate.py .
          python3 policy/tools/run_estate_gate.py programs/julia-oracle
      - name: Publish verified history to experiment branch
        env:
          GH_IMPORT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_IMPORT_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/migration/julia-oracle-history
